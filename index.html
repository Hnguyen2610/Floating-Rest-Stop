<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Floating Rest Stop</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #a9d8f0;
        overflow: hidden;
        /* #app's width/height are set in px by ScaleClamp (src/ui/ScaleClamp.ts),
           clamped to a safe aspect-ratio range on extreme viewports — this
           centers it, showing a small background-color bar outside it only
           in those out-of-range cases. */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
        /* Edge-to-edge fill (Scale.ENVELOP) still needs to clear notches/home
           indicators on iOS — viewport-fit=cover above lets content extend
           under them, this reserves the actual safe area within #app. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
